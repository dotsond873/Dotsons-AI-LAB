name: Build Shady Android
on:
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: shady-android-release
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SHADY_VERSION_CODE: ${{ github.run_number }}
      SHADY_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and check Android app
        working-directory: android
        run: SHADY_VERSION_CODE=$((1000 + SHADY_VERSION_CODE)) gradle --no-daemon :app:assembleRelease :app:lintRelease
      - name: Sign and verify installer
        env:
          SHADY_ANDROID_SIGNING_JSON: ${{ secrets.SHADY_ANDROID_SIGNING_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SHADY_ANDROID_SIGNING_JSON" ]; then
            echo 'Android compilation passed. Add the SHADY_ANDROID_SIGNING_JSON repository secret, then re-run this workflow to publish the installer.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          signing = json.loads(os.environ['SHADY_ANDROID_SIGNING_JSON'])
          root = Path(os.environ['RUNNER_TEMP'])
          for name, data in [('shady.jks', base64.b64decode(signing['keystore'])),
                             ('shady-password', signing['password'].encode())]:
              path = root / name
              path.write_bytes(data)
              path.chmod(0o600)
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/shady.jks" --ks-key-alias shady \
            --ks-pass "file:$RUNNER_TEMP/shady-password" \
            --key-pass "file:$RUNNER_TEMP/shady-password" \
            --out Shady.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Shady.apk
          sha256sum Shady.apk > Shady.apk.sha256
      - name: Publish Android download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="android-v${SHADY_VERSION_NAME}"
          printf 'Installable Android app for ODB Shady. Internet access is required.\n\nVersion %s. Built from commit %s.\n' "$SHADY_VERSION_NAME" "$GITHUB_SHA" > release-notes.txt
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Shady.apk Shady.apk.sha256 --clobber
          else
            gh release create "$tag" Shady.apk Shady.apk.sha256 \
              --target "$GITHUB_SHA" --title "Shady Android ${SHADY_VERSION_NAME}" \
              --notes-file release-notes.txt --latest
          fi
      - name: Remove signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/shady.jks" "$RUNNER_TEMP/shady-password"
